<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Craft - Datapack Texture Editor</title>
  <style>
    :root {
      --bg-dark: #121316;
      --bg-panel: #1e2025;
      --bg-card: #282b32;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-color: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background-color: var(--bg-panel);
      padding: 12px 24px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.025em;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .main-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      background-color: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-section {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-section h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    button {
      background-color: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    button:hover {
      border-color: var(--accent-color);
      background-color: #262930;
    }

    button.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #ffffff;
    }

    .btn-primary {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    select, input[type="text"], input[type="number"] {
      background-color: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 8px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 0.85rem;
      width: 100%;
    }

    select:focus, input[type="text"]:focus, input[type="number"]:focus {
      border-color: var(--accent-color);
    }

    /* Color Picker Styles */
    .color-picker-wrapper {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="color"] {
      appearance: none;
      -webkit-appearance: none;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 6px;
      cursor: pointer;
      background: none;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 1px solid var(--border-color);
      border-radius: 6px;
    }

    .color-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rgb-group {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .input-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .palette {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      margin-top: 4px;
    }

    .swatch {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .swatch:hover {
      transform: scale(1.1);
    }

    /* Blueprint Controls */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-color);
    }

    /* Editor Canvas Container */
    .editor-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background-color: #18191c;
      background-image: radial-gradient(#282b32 1px, transparent 1px);
      background-size: 20px 20px;
    }

    .canvas-wrapper {
      position: relative;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      border: 2px solid var(--border-color);
      border-radius: 4px;
      overflow: hidden;
      background-color: #ffffff;
      background-image: 
        linear-gradient(45deg, #ccc 25%, transparent 25%), 
        linear-gradient(-45deg, #ccc 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #ccc 75%), 
        linear-gradient(-45deg, transparent 75%, #ccc 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      cursor: crosshair;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Pixel Craft</h1>
      <p>Minecraft Datapack Texture Editor</p>
    </div>
    <div>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Canvas Size: 16 x 16</span>
    </div>
  </header>

  <div class="main-layout">
    <div class="sidebar">
      
      <!-- Vanilla Item Blueprint Loader -->
      <div class="panel-section">
        <h2>Minecraft Item Blueprint</h2>
        <select id="blueprint-select">
          <option value="none">-- No Blueprint --</option>
          <optgroup label="Swords & Weapons">
            <option value="diamond_sword">Diamond Sword</option>
            <option value="netherite_sword">Netherite Sword</option>
            <option value="iron_sword">Iron Sword</option>
            <option value="golden_sword">Golden Sword</option>
            <option value="wooden_sword">Wooden Sword</option>
            <option value="trident">Trident</option>
            <option value="bow">Bow</option>
            <option value="crossbow">Crossbow</option>
            <option value="arrow">Arrow</option>
          </optgroup>
          <optgroup label="Tools">
            <option value="diamond_pickaxe">Diamond Pickaxe</option>
            <option value="netherite_pickaxe">Netherite Pickaxe</option>
            <option value="diamond_axe">Diamond Axe</option>
            <option value="diamond_shovel">Diamond Shovel</option>
            <option value="diamond_hoe">Diamond Hoe</option>
            <option value="compass">Compass</option>
            <option value="clock">Clock</option>
            <option value="fishing_rod">Fishing Rod</option>
          </optgroup>
          <optgroup label="Food & Resources">
            <option value="apple">Apple</option>
            <option value="golden_apple">Golden Apple</option>

            <option value="bread">Bread</option>
            <option value="cooked_beef">Cooked Beef</option>
            <option value="diamond">Diamond</option>
            <option value="emerald">Emerald</option>
            <option value="gold_ingot">Gold Ingot</option>
            <option value="iron_ingot">Iron Ingot</option>
            <option value="netherite_ingot">Netherite Ingot</option>
          </optgroup>
          <optgroup label="Special & Magic">
            <option value="totem_of_undying">Totem of Undying</option>
            <option value="ender_pearl">Ender Pearl</option>
            <option value="eye_of_ender">Eye of Ender</option>
            <option value="elytra">Elytra</option>
            <option value="book">Book</option>
            <option value="enchanted_book">Enchanted Book</option>
            <option value="potion">Potion</option>
            <option value="experience_bottle">Experience Bottle</option>
          </optgroup>
        </select>

        <div class="slider-container">
          <span>Ghost Opacity:</span>
          <input type="range" id="ghost-opacity" min="0" max="100" value="40">
          <span id="opacity-val">40%</span>
        </div>

        <button id="btn-copy-blueprint" style="margin-top: 4px;">Copy Blueprint to Canvas</button>
      </div>

      <!-- Tool Options -->
      <div class="panel-section">
        <h2>Editing Tools</h2>
        <div class="tool-grid">
          <button id="tool-pencil" class="active">Pencil</button>
          <button id="tool-eraser">Eraser</button>
          <button id="tool-fill">Fill Bucket</button>
          <button id="tool-picker">Eyedropper</button>
        </div>
      </div>

      <!-- Color Selector (Full RGB & HEX Controls) -->
      <div class="panel-section">
        <h2>Color Selector</h2>
        <div class="color-inputs">
          <div class="color-picker-wrapper">
            <input type="color" id="color-picker" value="#3b82f6">
            <label class="input-label" style="flex: 1;">
              HEX
              <input type="text" id="color-hex" value="#3B82F6" maxlength="7">
            </label>
          </div>
          
          <div class="rgb-group">
            <label class="input-label">R <input type="number" id="rgb-r" min="0" max="255" value="59"></label>
            <label class="input-label">G <input type="number" id="rgb-g" min="0" max="255" value="130"></label>
            <label class="input-label">B <input type="number" id="rgb-b" min="0" max="255" value="246"></label>
          </div>
        </div>

        <div class="palette" id="swatch-palette"></div>
      </div>

      <!-- Export Single PNG -->
      <div class="panel-section">
        <h2>Export Single PNG</h2>
        <input type="text" id="filename-input" value="custom_item">
        <button id="btn-export" class="btn-primary">Download 16x16 .PNG</button>
        <button id="btn-clear" style="margin-top: 4px;">Clear Canvas</button>
      </div>

    </div>

    <!-- Canvas Viewport -->
    <div class="editor-container">
      <div class="canvas-wrapper">
        <canvas id="viewport" width="512" height="512"></canvas>
      </div>
    </div>
  </div>

  <script>
    const GRID_SIZE = 16;
    const VIEWPORT_SIZE = 512;
    const PIXEL_SCALE = VIEWPORT_SIZE / GRID_SIZE;
    const MINECRAFT_CDN = "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.1/assets/minecraft/textures/item/";

    // Drawing Canvas (User pixels)
    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = GRID_SIZE;
    offscreenCanvas.height = GRID_SIZE;
    const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

    // Ghost Blueprint Canvas (Vanilla reference pixels)
    const blueprintCanvas = document.createElement('canvas');
    blueprintCanvas.width = GRID_SIZE;
    blueprintCanvas.height = GRID_SIZE;
    const bpCtx = blueprintCanvas.getContext('2d', { willReadFrequently: true });

    // Viewport Display Canvas
    const viewportCanvas = document.getElementById('viewport');
    const viewCtx = viewportCanvas.getContext('2d');

    // UI Elements
    const colorPicker = document.getElementById('color-picker');
    const colorHex = document.getElementById('color-hex');
    const rgbR = document.getElementById('rgb-r');
    const rgbG = document.getElementById('rgb-g');
    const rgbB = document.getElementById('rgb-b');
    
    const blueprintSelect = document.getElementById('blueprint-select');
    const ghostOpacityInput = document.getElementById('ghost-opacity');
    const opacityValLabel = document.getElementById('opacity-val');
    const filenameInput = document.getElementById('filename-input');
    const swatchContainer = document.getElementById('swatch-palette');

    // App State
    let activeTool = 'pencil';
    let currentColor = '#3b82f6';
    let isDrawing = false;
    let hasBlueprint = false;
    let ghostOpacity = 0.4;

    // Palette Defaults
    const defaultSwatches = [
      '#000000', '#ffffff', '#7c2d12', '#b45309', '#f59e0b', '#fef08a',
      '#15803d', '#22c55e', '#06b6d4', '#3b82f6', '#1d4ed8', '#a855f7',
      '#ef4444', '#b91c1c', '#6b7280', '#374151', '#1f2937', '#111827'
    ];

    defaultSwatches.forEach(color => {
      const swatch = document.createElement('div');
      swatch.className = 'swatch';
      swatch.style.backgroundColor = color;
      swatch.addEventListener('click', () => setColorFromHex(color));
      swatchContainer.appendChild(swatch);
    });

    // Color Conversion & Syncing
    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) {
        hex = hex.split('').map(c => c + c).join('');
      }
      const num = parseInt(hex, 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255
      };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => {
        const hex = Math.max(0, Math.min(255, x)).toString(16);
        return hex.length === 1 ? "0" + hex : hex;
      }).join('');
    }

    function updateColorUI(r, g, b, hex) {
      currentColor = hex;
      colorPicker.value = hex;
      colorHex.value = hex.toUpperCase();
      rgbR.value = r;
      rgbG.value = g;
      rgbB.value = b;
    }

    function setColorFromHex(hex) {
      if (/^#?[0-9A-Fa-f]{6}$/.test(hex)) {
        const formatted = hex.startsWith('#') ? hex : '#' + hex;
        const { r, g, b } = hexToRgb(formatted);
        updateColorUI(r, g, b, formatted);
      }
    }

    colorPicker.addEventListener('input', (e) => setColorFromHex(e.target.value));
    colorHex.addEventListener('change', (e) => setColorFromHex(e.target.value));

    [rgbR, rgbG, rgbB].forEach(input => {
      input.addEventListener('change', () => {
        const r = parseInt(rgbR.value) || 0;
        const g = parseInt(rgbG.value) || 0;
        const b = parseInt(rgbB.value) || 0;
        const hex = rgbToHex(r, g, b);
        updateColorUI(r, g, b, hex);
      });
    });

    // Tool Buttons
    const tools = ['pencil', 'eraser', 'fill', 'picker'];
    tools.forEach(tool => {
      document.getElementById(`tool-${tool}`).addEventListener('click', (e) => {
        tools.forEach(t => document.getElementById(`tool-${t}`).classList.remove('active'));
        e.target.classList.add('active');
        activeTool = tool;
      });
    });

    // Ghost Opacity Slider
    ghostOpacityInput.addEventListener('input', (e) => {
      ghostOpacity = e.target.value / 100;
      opacityValLabel.textContent = `${e.target.value}%`;
      renderViewport();
    });

    // Fetch and Load Official Vanilla Minecraft Textures
    function loadVanillaBlueprint(itemName) {
      if (itemName === 'none') {
        bpCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
        hasBlueprint = false;
        renderViewport();
        return;
      }

      const img = new Image();
      img.crossOrigin = "Anonymous"; // Allows cross-domain canvas drawing
      img.src = `${MINECRAFT_CDN}${itemName}.png`;

      img.onload = () => {
        bpCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
        bpCtx.drawImage(img, 0, 0, GRID_SIZE, GRID_SIZE);
        hasBlueprint = true;
        renderViewport();
      };

      img.onerror = () => {
        console.warn(`Could not load texture for: ${itemName}`);
      };
    }

    blueprintSelect.addEventListener('change', (e) => {
      loadVanillaBlueprint(e.target.value);
    });

    // Copy Blueprint pixels over to active user canvas
    document.getElementById('btn-copy-blueprint').addEventListener('click', () => {
      if (!hasBlueprint) return;
      const bpData = bpCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE);
      offCtx.putImageData(bpData, 0, 0);
      renderViewport();
    });

    // Viewport Render Loop
    function renderViewport() {
      viewCtx.clearRect(0, 0, VIEWPORT_SIZE, VIEWPORT_SIZE);
      viewCtx.imageSmoothingEnabled = false;

      // 1. Render Ghost Blueprint (if loaded)
      if (hasBlueprint && ghostOpacity > 0) {
        viewCtx.save();
        viewCtx.globalAlpha = ghostOpacity;
        viewCtx.drawImage(blueprintCanvas, 0, 0, GRID_SIZE, GRID_SIZE, 0, 0, VIEWPORT_SIZE, VIEWPORT_SIZE);
        viewCtx.restore();
      }

      // 2. Render Active User Drawing Layer
      viewCtx.drawImage(offscreenCanvas, 0, 0, GRID_SIZE, GRID_SIZE, 0, 0, VIEWPORT_SIZE, VIEWPORT_SIZE);

      // 3. Render Pixel Grid Lines
      viewCtx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
      viewCtx.lineWidth = 1;

      for (let i = 0; i <= GRID_SIZE; i++) {
        const pos = i * PIXEL_SCALE;
        viewCtx.beginPath();
        viewCtx.moveTo(pos, 0);
        viewCtx.lineTo(pos, VIEWPORT_SIZE);
        viewCtx.stroke();

        viewCtx.beginPath();
        viewCtx.moveTo(0, pos);
        viewCtx.lineTo(VIEWPORT_SIZE, pos);
        viewCtx.stroke();
      }
    }

    // Pixel Drawing Operations
    function getGridCoords(e) {
      const rect = viewportCanvas.getBoundingClientRect();
      const x = Math.floor((e.clientX - rect.left) / PIXEL_SCALE);
      const y = Math.floor((e.clientY - rect.top) / PIXEL_SCALE);
      return { 
        x: Math.max(0, Math.min(GRID_SIZE - 1, x)), 
        y: Math.max(0, Math.min(GRID_SIZE - 1, y)) 
      };
    }

    function applyTool(x, y) {
      if (activeTool === 'pencil') {
        offCtx.fillStyle = currentColor;
        offCtx.fillRect(x, y, 1, 1);
      } else if (activeTool === 'eraser') {
        offCtx.clearRect(x, y, 1, 1);
      } else if (activeTool === 'picker') {
        // Sample from drawing canvas first, or blueprint canvas if blank
        let pixel = offCtx.getImageData(x, y, 1, 1).data;
        if (pixel[3] === 0 && hasBlueprint) {
          pixel = bpCtx.getImageData(x, y, 1, 1).data;
        }
        if (pixel[3] > 0) {
          const hex = rgbToHex(pixel[0], pixel[1], pixel[2]);
          setColorFromHex(hex);
        }
      } else if (activeTool === 'fill') {
        floodFill(x, y, currentColor);
      }
      renderViewport();
    }

    function floodFill(startX, startY, hexColor) {
      const targetData = offCtx.getImageData(startX, startY, 1, 1).data;
      const targetColor = [...targetData];
      
      const { r, g, b } = hexToRgb(hexColor);
      const fillColor = [r, g, b, 255];

      if (targetColor.every((val, idx) => val === fillColor[idx])) return;

      const stack = [[startX, startY]];
      const imgData = offCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE);

      while (stack.length > 0) {
        const [x, y] = stack.pop();
        if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) continue;

        const idx = (y * GRID_SIZE + x) * 4;
        const curColor = [
          imgData.data[idx],
          imgData.data[idx + 1],
          imgData.data[idx + 2],
          imgData.data[idx + 3]
        ];

        if (curColor.every((val, i) => val === targetColor[i])) {
          imgData.data[idx] = fillColor[0];
          imgData.data[idx + 1] = fillColor[1];
          imgData.data[idx + 2] = fillColor[2];
          imgData.data[idx + 3] = fillColor[3];

          stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
        }
      }
      offCtx.putImageData(imgData, 0, 0);
    }

    // Mouse Interaction
    viewportCanvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      const { x, y } = getGridCoords(e);
      applyTool(x, y);
    });

    viewportCanvas.addEventListener('mousemove', (e) => {
      if (isDrawing && (activeTool === 'pencil' || activeTool === 'eraser')) {
        const { x, y } = getGridCoords(e);
        applyTool(x, y);
      }
    });

    window.addEventListener('mouseup', () => { isDrawing = false; });

    // Clear Canvas
    document.getElementById('btn-clear').addEventListener('click', () => {
      offCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
      renderViewport();
    });

    // Single PNG Export
    document.getElementById('btn-export').addEventListener('click', () => {
      const filename = filenameInput.value.trim() || 'custom_texture';
      
      offscreenCanvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename.endsWith('.png') ? filename : `${filename}.png`;
        
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }, 'image/png');
    });

    // Default Initialization
    blueprintSelect.value = 'diamond_sword';
    loadVanillaBlueprint('diamond_sword');
  </script>
</body>
</html>
