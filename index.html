<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Craft - Minecraft Texture Editor</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --accent-color: #55ff55;
            --btn-hover: #3d3d3d;
            --text-color: #ffffff;
            --border-color: #444444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--panel-bg);
            padding: 12px 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .title-group h1 {
            font-size: 1.4rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            background-color: var(--panel-bg);
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }

        label {
            font-size: 0.85rem;
            color: #aaa;
        }

        select, button, input[type="color"] {
            background-color: #333;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--btn-hover);
            border-color: var(--accent-color);
        }

        button.active {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
        }

        /* Highlight feature button */
        .btn-fill-ghost {
            background-color: #2b4c7e;
            border-color: #4a90e2;
            color: #ffffff;
            font-weight: 600;
        }

        .btn-fill-ghost:hover {
            background-color: #3562a6;
            border-color: #64b5f6;
            box-shadow: 0 0 8px rgba(74, 144, 226, 0.4);
        }

        .main-container {
            display: flex;
            flex: 1;
            position: relative;
        }

        .workspace {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #121212;
            position: relative;
            background-image: 
                linear-gradient(45deg, #1e1e1e 25%, transparent 25%), 
                linear-gradient(-45deg, #1e1e1e 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e1e1e 75%), 
                linear-gradient(-45deg, transparent 75%, #1e1e1e 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .canvas-wrapper {
            position: relative;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            border: 1px solid var(--border-color);
        }

        /* Stack main canvas and ghost overlay on top of each other */
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #mainCanvas {
            background-color: transparent;
            position: relative;
            z-index: 1;
        }

        #ghostCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            pointer-events: none; /* Mouse clicks pass through to main canvas */
            opacity: 0.45; /* Semi-transparent guide */
        }

        .sidebar {
            width: 220px;
            background-color: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sidebar-section h3 {
            font-size: 0.9rem;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-group">
            <h1>Pixel Craft</h1>
            <span style="font-size: 0.8rem; color: #888;">Minecraft Texture Editor</span>
        </div>
        <button id="exportBtn">Export Texture (.png)</button>
    </header>

    <div class="toolbar">
        <!-- Drawing Tools -->
        <div class="tool-group">
            <button id="pencilBtn" class="active">Pencil</button>
            <button id="eraserBtn">Eraser</button>
            <button id="bucketBtn">Fill Bucket</button>
        </div>

        <!-- Primary Color -->
        <div class="tool-group">
            <label for="colorPicker">Color:</label>
            <input type="color" id="colorPicker" value="#3a86ff">
        </div>

        <!-- Ghost Templates -->
        <div class="tool-group">
            <label for="templateSelect">Ghost Overlay:</label>
            <select id="templateSelect">
                <option value="none">None</option>
                <option value="sword">Sword Base</option>
                <option value="pickaxe">Pickaxe Base</option>
                <option value="chestplate">Chestplate Base</option>
                <option value="helmet">Helmet Base</option>
            </select>
        </div>

        <!-- Action Button: Fill Ghost Template -->
        <div class="tool-group">
            <button id="fillGhostBtn" class="btn-fill-ghost" title="Copy non-transparent pixels from the ghost guide into the canvas">
                ✨ Fill Ghost Template
            </button>
        </div>

        <!-- Undo / Redo -->
        <div class="tool-group">
            <button id="undoBtn">Undo</button>
            <button id="clearBtn">Clear Canvas</button>
        </div>
    </div>

    <div class="main-container">
        <div class="workspace">
            <div class="canvas-wrapper">
                <canvas id="mainCanvas" width="16" height="16"></canvas>
                <canvas id="ghostCanvas" width="16" height="16"></canvas>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-section">
                <h3>Canvas Specs</h3>
                <label>Resolution: 16 x 16 px</label>
            </div>
            <div class="sidebar-section">
                <h3>Quick Tips</h3>
                <p style="font-size:0.8rem; color:#aaa; line-height:1.4;">
                    Select a ghost template above to view guide outlines. Click <b>Fill Ghost Template</b> to convert the overlay into solid pixels for quick editing!
                </p>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const mainCanvas = document.getElementById('mainCanvas');
        const mainCtx = mainCanvas.getContext('2d', { willReadFrequently: true });
        const ghostCanvas = document.getElementById('ghostCanvas');
        const ghostCtx = ghostCanvas.getContext('2d', { willReadFrequently: true });

        const colorPicker = document.getElementById('colorPicker');
        const templateSelect = document.getElementById('templateSelect');
        const fillGhostBtn = document.getElementById('fillGhostBtn');
        const pencilBtn = document.getElementById('pencilBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const bucketBtn = document.getElementById('bucketBtn');
        const undoBtn = document.getElementById('undoBtn');
        const clearBtn = document.getElementById('clearBtn');
        const exportBtn = document.getElementById('exportBtn');

        // Editor State
        const GRID_SIZE = 16;
        const CANVAS_DISPLAY_SIZE = 512; // Displayed size in CSS pixels
        let currentTool = 'pencil'; // 'pencil', 'eraser', 'bucket'
        let isDrawing = false;
        let historyStack = [];
        const MAX_HISTORY = 20;

        // Scale canvas visual size
        mainCanvas.style.width = `${CANVAS_DISPLAY_SIZE}px`;
        mainCanvas.style.height = `${CANVAS_DISPLAY_SIZE}px`;
        ghostCanvas.style.width = `${CANVAS_DISPLAY_SIZE}px`;
        ghostCanvas.style.height = `${CANVAS_DISPLAY_SIZE}px`;

        // Save state for Undo history
        function saveState() {
            if (historyStack.length >= MAX_HISTORY) historyStack.shift();
            historyStack.push(mainCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE));
        }

        // Initialize state
        saveState();

        // Preset Minecraft Ghost Templates (16x16 Pixel Maps)
        const TEMPLATES = {
            sword: [
                "0000000000000011",
                "0000000000001111",
                "0000000000111110",
                "0000000001111100",
                "0000000011111000",
                "0000000111110000",
                "0000001111100000",
                "0000011111000000",
                "0000111110000000",
                "0011111100000000",
                "0111111000000000",
                "0011110000000000",
                "0001100000000000",
                "0011010000000000",
                "0110001000000000",
                "1100000100000000"
            ],
            pickaxe: [
                "0000111111111100",
                "0001111111111110",
                "0001100000001110",
                "0000000000011100",
                "0000000000111000",
                "0000000001110000",
                "0000000011100000",
                "0000000111000000",
                "0000001110000000",
                "0000011100000000",
                "0000111000000000",
                "0001110000000000",
                "0011100000000000",
                "0111000000000000",
                "1110000000000000",
                "1100000000000000"
            ],
            chestplate: [
                "0111100000011110",
                "1111110000111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "0111111111111110",
                "0111111111111110",
                "0111111111111110",
                "0011111111111100",
                "0011111111111100",
                "0001111111111000",
                "0000111111110000"
            ],
            helmet: [
                "0000111111110000",
                "0011111111111100",
                "0111111111111110",
                "1111111111111111",
                "1111111111111111",
                "1111111111111111",
                "1111100000011111",
                "1111000000001111",
                "1111000000001111",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000",
                "0000000000000000"
            ]
        };

        // Render Ghost Guide Overlay
        function renderGhostTemplate(key) {
            ghostCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
            if (key === 'none' || !TEMPLATES[key]) return;

            const map = TEMPLATES[key];
            const imgData = ghostCtx.createImageData(GRID_SIZE, GRID_SIZE);

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const char = map[y][x];
                    if (char === '1') {
                        const idx = (y * GRID_SIZE + x) * 4;
                        imgData.data[idx] = 200;     // R
                        imgData.data[idx + 1] = 200; // G
                        imgData.data[idx + 2] = 200; // B
                        imgData.data[idx + 3] = 220; // Alpha
                    }
                }
            }
            ghostCtx.putImageData(imgData, 0, 0);
        }

        /**
         * FEATURE IMPLEMENTATION:
         * Transfers pixels from ghost overlay to the main drawing canvas.
         */
        function fillGhostTemplate() {
            const selectedKey = templateSelect.value;
            if (selectedKey === 'none') {
                alert("Please select a Ghost Overlay template first!");
                return;
            }

            // Save state for undo before modifying
            saveState();

            // Extract pixel buffers
            const ghostImgData = ghostCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE);
            const mainImgData = mainCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE);
            const drawColorHex = colorPicker.value;

            // Convert hex color to RGB
            const r = parseInt(drawColorHex.slice(1, 3), 16);
            const g = parseInt(drawColorHex.slice(3, 5), 16);
            const b = parseInt(drawColorHex.slice(5, 7), 16);

            // Copy guide pixels over to the main layer
            for (let i = 0; i < ghostImgData.data.length; i += 4) {
                const ghostAlpha = ghostImgData.data[i + 3];
                if (ghostAlpha > 0) {
                    mainImgData.data[i] = r;         // R
                    mainImgData.data[i + 1] = g;     // G
                    mainImgData.data[i + 2] = b;     // B
                    mainImgData.data[i + 3] = 255;   // Solid Alpha for editing
                }
            }

            // Write back updated pixels to main canvas
            mainCtx.putImageData(mainImgData, 0, 0);
        }

        // Canvas Drawing Operations
        function getCanvasCoordinates(e) {
            const rect = mainCanvas.getBoundingClientRect();
            const scaleX = GRID_SIZE / rect.width;
            const scaleY = GRID_SIZE / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            return { x, y };
        }

        function drawPixel(x, y, colorHex) {
            if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return;
            if (currentTool === 'eraser') {
                mainCtx.clearRect(x, y, 1, 1);
            } else {
                mainCtx.fillStyle = colorHex;
                mainCtx.fillRect(x, y, 1, 1);
            }
        }

        function floodFill(startX, startY, fillColorHex) {
            const imgData = mainCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE);
            const data = imgData.data;

            function getPixelColor(x, y) {
                const idx = (y * GRID_SIZE + x) * 4;
                return [data[idx], data[idx + 1], data[idx + 2], data[idx + 3]];
            }

            const targetColor = getPixelColor(startX, startY);
            
            // Hex to RGBA
            const r = parseInt(fillColorHex.slice(1, 3), 16);
            const g = parseInt(fillColorHex.slice(3, 5), 16);
            const b = parseInt(fillColorHex.slice(5, 7), 16);
            const fillRgba = [r, g, b, 255];

            if (targetColor.every((val, i) => val === fillRgba[i])) return;

            const queue = [[startX, startY]];
            while (queue.length > 0) {
                const [x, y] = queue.pop();
                const idx = (y * GRID_SIZE + x) * 4;

                data[idx] = r;
                data[idx + 1] = g;
                data[idx + 2] = b;
                data[idx + 3] = 255;

                const neighbors = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
                for (const [nx, ny] of neighbors) {
                    if (nx >= 0 && nx < GRID_SIZE && ny >= 0 && ny < GRID_SIZE) {
                        const neighborColor = getPixelColor(nx, ny);
                        if (neighborColor.every((val, i) => val === targetColor[i])) {
                            queue.push([nx, ny]);
                        }
                    }
                }
            }

            mainCtx.putImageData(imgData, 0, 0);
        }

        // Event Listeners
        templateSelect.addEventListener('change', (e) => renderGhostTemplate(e.target.value));
        fillGhostBtn.addEventListener('click', fillGhostTemplate);

        mainCanvas.addEventListener('mousedown', (e) => {
            saveState();
            isDrawing = true;
            const { x, y } = getCanvasCoordinates(e);

            if (currentTool === 'bucket') {
                floodFill(x, y, colorPicker.value);
            } else {
                drawPixel(x, y, colorPicker.value);
            }
        });

        mainCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || currentTool === 'bucket') return;
            const { x, y } = getCanvasCoordinates(e);
            drawPixel(x, y, colorPicker.value);
        });

        window.addEventListener('mouseup', () => { isDrawing = false; });

        // Tool Selection
        [pencilBtn, eraserBtn, bucketBtn].forEach(btn => {
            btn.addEventListener('click', () => {
                [pencilBtn, eraserBtn, bucketBtn].forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                if (btn === pencilBtn) currentTool = 'pencil';
                if (btn === eraserBtn) currentTool = 'eraser';
                if (btn === bucketBtn) currentTool = 'bucket';
            });
        });

        // Undo Function
        undoBtn.addEventListener('click', () => {
            if (historyStack.length > 1) {
                historyStack.pop(); // Remove current state
                const prevState = historyStack[historyStack.length - 1];
                mainCtx.putImageData(prevState, 0, 0);
            }
        });

        // Clear Canvas
        clearBtn.addEventListener('click', () => {
            saveState();
            mainCtx.clearRect(0, 0, GRID_SIZE, GRID_SIZE);
        });

        // Export PNG
        exportBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = 'minecraft_texture.png';
            link.href = mainCanvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
